name: Python static analysis CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require GNU objdump for structural disassembly fixtures
        run: command -v objdump && objdump --version | head -1
      - name: Compile source
        run: python -m compileall -q tools tests
      - name: Validate offline batch CLI without original sample
        run: python -m tools.rea_parallel_batch --help > /dev/null
      - name: Execute unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate REA action plan, evidence and status synchronization
        run: python -m tools.rea_progress --check
      - name: Validate full-scope coverage denominators and 100-percent gates
        run: python -m tools.rea_coverage --check
      - name: Verify independent certification gates and signed-proof ledger
        run: python -m tools.rea_certification --check
      - name: Publish clear CI summary
        if: success()
        run: |
          echo "### REA CI — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Documentation/evidence checks: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Internal certification: NOT YET ISSUED (separate signed gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Windows 7 driver validation: not executed" >> "$GITHUB_STEP_SUMMARY"
